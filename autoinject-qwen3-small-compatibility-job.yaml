apiVersion: batch/v1
kind: Job
metadata:
  name: autoinject-qwen3-small-compatibility
  namespace: ucr-rai-chazz
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: compatibility
          image: python:3.12-slim
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nrp-llm-token
                  key: NRP_LLM_TOKEN
            - name: OPENAI_BASE_URL
              value: https://ellm.nrp-nautilus.io/v1
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              python -m pip install --no-cache-dir --quiet 'openai==1.64.0'
              python - <<'PY'
              import math
              import os
              import re
              import time

              from openai import OpenAI


              class CheckFailure(Exception):
                  pass


              def require(condition, check):
                  if not condition:
                      raise CheckFailure(check)


              def value_from(obj, name):
                  if isinstance(obj, dict):
                      return obj.get(name)
                  return getattr(obj, name, None)


              def normalized_alternatives(position):
                  alternatives = {}
                  candidates = list(value_from(position, "top_logprobs") or [])
                  emitted_token = value_from(position, "token")
                  emitted_logprob = value_from(position, "logprob")
                  if emitted_token is not None and emitted_logprob is not None:
                      candidates.append(
                          {"token": emitted_token, "logprob": emitted_logprob}
                      )

                  for candidate in candidates:
                      token = value_from(candidate, "token")
                      logprob = value_from(candidate, "logprob")
                      if token is None or logprob is None:
                          continue
                      normalized = token.strip()
                      if normalized not in {"0", "1"}:
                          continue
                      numeric_logprob = float(logprob)
                      previous = alternatives.get(normalized)
                      if previous is None or numeric_logprob > previous:
                          alternatives[normalized] = numeric_logprob
                  return alternatives


              def validate_response(response):
                  choices = value_from(response, "choices")
                  require(choices is not None and len(choices) == 1, "choice_count")
                  choice = choices[0]

                  message = value_from(choice, "message")
                  content = value_from(message, "content")
                  require(content is not None, "message_content")
                  require(
                      "<think>" not in content and "</think>" not in content,
                      "think_tags",
                  )

                  reasoning = value_from(message, "reasoning_content")
                  reasoning_absent = reasoning is None or reasoning == ""
                  require(reasoning_absent, "reasoning_content")

                  lines = content.splitlines()
                  require(bool(lines), "final_answer")
                  answer_match = re.fullmatch(r"^Answer:\s*([01])\s*$", lines[-1])
                  require(answer_match is not None, "final_answer")
                  answer_digit = answer_match.group(1)
                  final_answer = lines[-1]

                  logprobs = value_from(choice, "logprobs")
                  require(logprobs is not None, "logprobs")
                  logprob_content = value_from(logprobs, "content")
                  require(logprob_content is not None and len(logprob_content) > 0, "logprobs_content")

                  answer_position = None
                  for position in reversed(logprob_content[-12:]):
                      emitted = value_from(position, "token")
                      if emitted is not None and emitted.strip() == answer_digit:
                          answer_position = position
                          break
                  require(answer_position is not None, "answer_digit_token")

                  emitted_answer_token = value_from(answer_position, "token").strip()
                  alternatives = normalized_alternatives(answer_position)
                  require("0" in alternatives and "1" in alternatives, "digit_logprobs")

                  logprob_0 = alternatives["0"]
                  logprob_1 = alternatives["1"]
                  require(
                      not math.isnan(logprob_0) and not math.isnan(logprob_1),
                      "digit_logprobs",
                  )
                  maximum = max(logprob_0, logprob_1)
                  require(math.isfinite(maximum), "digit_logprobs")
                  weight_0 = math.exp(logprob_0 - maximum)
                  weight_1 = math.exp(logprob_1 - maximum)
                  require(not (weight_0 == 0.0 and weight_1 == 0.0), "zero_weights")
                  denominator = weight_0 + weight_1
                  require(denominator > 0.0 and math.isfinite(denominator), "softmax")
                  probability_0 = weight_0 / denominator
                  probability_1 = weight_1 / denominator
                  require(
                      math.isfinite(probability_0) and math.isfinite(probability_1),
                      "finite_probabilities",
                  )
                  require(
                      math.isclose(
                          probability_0 + probability_1,
                          1.0,
                          rel_tol=1e-12,
                          abs_tol=1e-12,
                      ),
                      "probability_sum",
                  )

                  return (
                      final_answer,
                      emitted_answer_token,
                      probability_0,
                      probability_1,
                      reasoning_absent,
                  )


              client = OpenAI(
                  api_key=os.environ["OPENAI_API_KEY"],
                  base_url=os.environ["OPENAI_BASE_URL"],
                  max_retries=0,
                  timeout=120.0,
              )

              request = {
                  "model": "qwen3-small",
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Perform the requested comparison. Do not explain. "
                              "The final line must be exactly Answer: 0 or Answer: 1."
                          ),
                      },
                      {
                          "role": "user",
                          "content": (
                              "Compare the integers 17 and 9. If 17 is greater than 9, "
                              "use 1; otherwise use 0."
                          ),
                      },
                  ],
                  "temperature": 0.0,
                  "max_tokens": 350,
                  "logprobs": True,
                  "top_logprobs": 5,
                  "extra_body": {
                      "chat_template_kwargs": {
                          "enable_thinking": False,
                      }
                  },
                  "stream": False,
              }

              all_passed = True
              for attempt in range(1, 4):
                  started = time.monotonic()
                  passed = False
                  final_answer = "<unavailable>"
                  emitted_answer_token = "<unavailable>"
                  probability_0 = None
                  probability_1 = None
                  reasoning_absent = False
                  failure_check = None

                  try:
                      response = client.chat.completions.create(**request)
                      (
                          final_answer,
                          emitted_answer_token,
                          probability_0,
                          probability_1,
                          reasoning_absent,
                      ) = validate_response(response)
                      passed = True
                  except CheckFailure as exc:
                      failure_check = str(exc)
                  except Exception:
                      failure_check = "http_request"

                  elapsed = time.monotonic() - started
                  all_passed = all_passed and passed
                  print(f"attempt: {attempt}")
                  print(f"status: {'PASS' if passed else 'FAIL'}")
                  print(f"elapsed_seconds: {elapsed:.3f}")
                  print(f"final_textual_answer: {final_answer}")
                  print(f"emitted_answer_token: {emitted_answer_token}")
                  print(
                      "probability_0: "
                      + ("<unavailable>" if probability_0 is None else f"{probability_0:.12g}")
                  )
                  print(
                      "probability_1: "
                      + ("<unavailable>" if probability_1 is None else f"{probability_1:.12g}")
                  )
                  print(f"reasoning_content_absent: {reasoning_absent}")
                  if failure_check is not None:
                      print(f"failed_check: {failure_check}")

              raise SystemExit(0 if all_passed else 1)
              PY
