apiVersion: batch/v1
kind: Job
metadata:
  name: autoinject-qwen3-l40-cold-baseline-rem31-v1
  namespace: ucr-rai-chazz
  labels:
    app.kubernetes.io/name: autoinject-qwen3-small
    app.kubernetes.io/instance: qwen3-l40-cold-baseline-rem31-v1
    autoinject-run-kind: l40-cold-baseline-indexed-remaining31-v1
spec:
  completionMode: Indexed
  completions: 31
  parallelism: 3
  backoffLimitPerIndex: 0
  maxFailedIndexes: 31
  activeDeadlineSeconds: 259200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoinject-qwen3-small
        app.kubernetes.io/instance: qwen3-l40-cold-baseline-rem31-v1
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      activeDeadlineSeconds: 43200
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-L40, NVIDIA-L40S]
      initContainers:
      - name: stage-frozen-source-and-placement-patch
        image: alpine/git:v2.47.2
        command: [/bin/sh, -ec]
        args:
        - |
          set -euxo pipefail
          export GIT_TERMINAL_PROMPT=0
          EXPECTED_COMMIT=c4eedbdd9822cfdaaa4ba229d88d31beccf84bb7
          EXPECTED_PATCH_SHA256=1a5c6d59c5fde4e36538d6fa2ac3e281b6573373495ecddc8b03b26685a0eb1b
          PRIVATE_REPO=/work/AutoInject; PATCH=/runtime/placement.patch
          test ! -e "${PRIVATE_REPO}"; test -s "${PATCH}"
          test "$(sha256sum "${PATCH}" | cut -d' ' -f1)" = "${EXPECTED_PATCH_SHA256}"
          mkdir "${PRIVATE_REPO}"
          git -C "${PRIVATE_REPO}" init
          git -C "${PRIVATE_REPO}" remote add origin https://github.com/czcarrizales/AutoInject
          timeout 300 git -C "${PRIVATE_REPO}" fetch --no-tags origin refs/heads/experiments/qwen3-small-baseline-v1
          BRANCH_TIP="$(git -C "${PRIVATE_REPO}" rev-parse FETCH_HEAD)"
          git -C "${PRIVATE_REPO}" cat-file -e "${EXPECTED_COMMIT}^{commit}"
          git -C "${PRIVATE_REPO}" merge-base --is-ancestor "${EXPECTED_COMMIT}" "${BRANCH_TIP}"
          git -C "${PRIVATE_REPO}" checkout --detach "${EXPECTED_COMMIT}"
          test "$(git -C "${PRIVATE_REPO}" rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          git -C "${PRIVATE_REPO}" apply --check "${PATCH}"; git -C "${PRIVATE_REPO}" apply "${PATCH}"
          git -C "${PRIVATE_REPO}" diff --check
          mkdir /work/provenance-staging
          git -C "${PRIVATE_REPO}" rev-parse HEAD > /work/provenance-staging/source-commit.txt
          git -C "${PRIVATE_REPO}" diff --binary > /work/provenance-staging/runtime-placement.patch
          sha256sum /work/provenance-staging/runtime-placement.patch > /work/provenance-staging/runtime-placement.patch.sha256
          test "$(cut -d' ' -f1 /work/provenance-staging/runtime-placement.patch.sha256)" = "${EXPECTED_PATCH_SHA256}"
        resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: 250m, memory: 256Mi}}
        volumeMounts:
        - {name: private-work, mountPath: /work}
        - {name: runtime, mountPath: /runtime, readOnly: true}
      containers:
      - name: autoinject-qwen3-small
        image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
        command: [bash, -lc]
        args:
        - |
          set -Eeuo pipefail
          utc_now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          case "${JOB_COMPLETION_INDEX:-}" in
            0) SUITE=workspace; USER_TASK=user_task_38; INJECTION_TASK=injection_task_10;; 1) SUITE=workspace; USER_TASK=user_task_38; INJECTION_TASK=injection_task_11;; 2) SUITE=workspace; USER_TASK=user_task_38; INJECTION_TASK=injection_task_12;; 3) SUITE=workspace; USER_TASK=user_task_38; INJECTION_TASK=injection_task_13;;
            4) SUITE=workspace; USER_TASK=user_task_39; INJECTION_TASK=injection_task_10;; 5) SUITE=workspace; USER_TASK=user_task_39; INJECTION_TASK=injection_task_11;; 6) SUITE=workspace; USER_TASK=user_task_39; INJECTION_TASK=injection_task_12;; 7) SUITE=workspace; USER_TASK=user_task_39; INJECTION_TASK=injection_task_13;;
            8) SUITE=banking; USER_TASK=user_task_14; INJECTION_TASK=injection_task_5;; 9) SUITE=banking; USER_TASK=user_task_14; INJECTION_TASK=injection_task_6;; 10) SUITE=banking; USER_TASK=user_task_14; INJECTION_TASK=injection_task_7;; 11) SUITE=banking; USER_TASK=user_task_14; INJECTION_TASK=injection_task_8;;
            12) SUITE=banking; USER_TASK=user_task_15; INJECTION_TASK=injection_task_5;; 13) SUITE=banking; USER_TASK=user_task_15; INJECTION_TASK=injection_task_6;; 14) SUITE=banking; USER_TASK=user_task_15; INJECTION_TASK=injection_task_7;; 15) SUITE=banking; USER_TASK=user_task_15; INJECTION_TASK=injection_task_8;;
            16) SUITE=travel; USER_TASK=user_task_18; INJECTION_TASK=injection_task_4;; 17) SUITE=travel; USER_TASK=user_task_18; INJECTION_TASK=injection_task_5;; 18) SUITE=travel; USER_TASK=user_task_18; INJECTION_TASK=injection_task_6;; 19) SUITE=travel; USER_TASK=user_task_19; INJECTION_TASK=injection_task_3;; 20) SUITE=travel; USER_TASK=user_task_19; INJECTION_TASK=injection_task_4;; 21) SUITE=travel; USER_TASK=user_task_19; INJECTION_TASK=injection_task_5;; 22) SUITE=travel; USER_TASK=user_task_19; INJECTION_TASK=injection_task_6;;
            23) SUITE=slack; USER_TASK=user_task_19; INJECTION_TASK=injection_task_2;; 24) SUITE=slack; USER_TASK=user_task_19; INJECTION_TASK=injection_task_3;; 25) SUITE=slack; USER_TASK=user_task_19; INJECTION_TASK=injection_task_4;; 26) SUITE=slack; USER_TASK=user_task_19; INJECTION_TASK=injection_task_5;; 27) SUITE=slack; USER_TASK=user_task_20; INJECTION_TASK=injection_task_2;; 28) SUITE=slack; USER_TASK=user_task_20; INJECTION_TASK=injection_task_3;; 29) SUITE=slack; USER_TASK=user_task_20; INJECTION_TASK=injection_task_4;; 30) SUITE=slack; USER_TASK=user_task_20; INJECTION_TASK=injection_task_5;;
            *) echo "Invalid JOB_COMPLETION_INDEX" >&2; exit 64;;
          esac
          readonly TASK_NAME="${SUITE}-u${USER_TASK#user_task_}-i${INJECTION_TASK#injection_task_}-attempt-01"
          readonly RESULT_ROOT="/workspace/results/autoinject-qwen3-small/l40-cold-baseline-v1/indexed-remaining-31/${TASK_NAME}"
          readonly RUN_DIR="${RESULT_ROOT}/run"; readonly PROVENANCE_DIR="${RESULT_ROOT}/provenance"
          trap 'status=$?; printf "=== CGROUP RESOURCE SUMMARY ===\\n"; [[ -s "${PROVENANCE_DIR}/cgroup-resource-summary.txt" ]] && cat "${PROVENANCE_DIR}/cgroup-resource-summary.txt" || true; printf "FINAL_RESULT_DIRECTORY=%s\\n" "${RESULT_ROOT}"; exit "$status"' EXIT
          test ! -e "${RESULT_ROOT}"; mkdir -p "$(dirname "${RESULT_ROOT}")"; mkdir "${RESULT_ROOT}" "${RUN_DIR}" "${PROVENANCE_DIR}"
          exec > >(tee -a "${RESULT_ROOT}/job.log") 2>&1
          cp /work/provenance-staging/* "${PROVENANCE_DIR}/"
          test "$(cat "${PROVENANCE_DIR}/source-commit.txt")" = c4eedbdd9822cfdaaa4ba229d88d31beccf84bb7
          test "$(cut -d' ' -f1 "${PROVENANCE_DIR}/runtime-placement.patch.sha256")" = 1a5c6d59c5fde4e36538d6fa2ac3e281b6573373495ecddc8b03b26685a0eb1b
          mkdir -p /work/home /work/tmp /work/cache/huggingface/modules
          nvidia-smi
          printf 'timestamp_utc\\tepoch_seconds\\tmemory_current\\tcpu_usage_usec\\n' > "${PROVENANCE_DIR}/cgroup-resource-samples.tsv"
          (while :; do printf '%s\\t%s\\t%s\\t%s\\n' "$(utc_now)" "$(date +%s)" "$(cat /sys/fs/cgroup/memory.current 2>/dev/null || true)" "$(awk '$1==\"usage_usec\"{print $2}' /sys/fs/cgroup/cpu.stat 2>/dev/null || true)" >> "${PROVENANCE_DIR}/cgroup-resource-samples.tsv"; sleep 1; done) & CGROUP_PID=$!
          trap 'kill "${CGROUP_PID}" 2>/dev/null || true; awk -F "\\t" "NR>1 {if (\\$3>m)m=\\$3} END {print \"peak_memory_bytes=\" m}" "${PROVENANCE_DIR}/cgroup-resource-samples.tsv" > "${PROVENANCE_DIR}/cgroup-resource-summary.txt"; status=$?; printf "=== CGROUP RESOURCE SUMMARY ===\\n"; cat "${PROVENANCE_DIR}/cgroup-resource-summary.txt"; exit "$status"' EXIT
          unset PYTORCH_CUDA_ALLOC_CONF
          /opt/conda/bin/python -m pip install --constraint /runtime/runtime-constraints.txt --editable /work/AutoInject/agentdojo
          /opt/conda/bin/python -m pip install --constraint /runtime/runtime-constraints.txt --editable /work/AutoInject
          export PYTHONPATH=/work/AutoInject/src:/work/AutoInject/agentdojo/src
          export TASK_SUITE="${SUITE}" TASK_USER_TASK="${USER_TASK}" TASK_INJECTION_TASK="${INJECTION_TASK}" RESULT_ROOT
          /opt/conda/bin/python - "${PROVENANCE_DIR}/provenance.json" <<'PY'
          import json, os, subprocess, sys, torch
          p={"completion_index":os.environ["JOB_COMPLETION_INDEX"],"suite":os.environ["TASK_SUITE"],"user_task":os.environ["TASK_USER_TASK"],"injection_task":os.environ["TASK_INJECTION_TASK"],"job_name":"autoinject-qwen3-l40-cold-baseline-rem31-v1","attempt":1,"cold_start":True,"policy_checkpoint_reuse":False,"suffix_reuse":False,"victim_model":"facebook/Meta-SecAlign-8B","policy_model":"Qwen/Qwen2-1.5B","feedback_model":"qwen3-small","source_commit":"c4eedbdd9822cfdaaa4ba229d88d31beccf84bb7","patch_hash":"1a5c6d59c5fde4e36538d6fa2ac3e281b6573373495ecddc8b03b26685a0eb1b","gpu_product":torch.cuda.get_device_name(0),"gpu_memory":torch.cuda.get_device_properties(0).total_memory,"node_name":os.environ.get("NODE_NAME"),"cpu_request":"2","cpu_limit":"2","memory_request":"24Gi","memory_limit":"24Gi","result_directory":os.environ["RESULT_ROOT"]}
          json.dump(p,open(sys.argv[1],"w"),indent=2); print(json.dumps(p))
          PY
          cd "${RUN_DIR}"
          /opt/conda/bin/python -u -m rlpi.agentdojo.adaptive_agentdojo exp_ident="meta-secalign-qwen3-small-l40-cold-baseline-rem31-v1-${TASK_NAME}" model=facebook/Meta-SecAlign-8B victim_device=cuda:0 learner=trl_suffix_meta_secalign_repro learner.attack_model_name=Qwen/Qwen2-1.5B learner.device=cuda:0 +learner.feedback_model=qwen3-small model_id=null attack=direct defense=null system_message=null force_rerun=false max_tokens=null 'modules_to_load=[]' learner.feedback_fallback_model=gpt-4o-mini-2024-07-18 learner.max_suffix_length=30 learner.temperature=0.9 learner.top_p=0.95 learner.min_experiences_for_training=1 learner.grpo_num_generations=8 learner.grpo_num_iterations=5 learner.grpo_learning_rate=1.0e-5 learner.grpo_per_device_train_batch_size=2 learner.grpo_gradient_accumulation_steps=2 learner.grpo_warmup_steps=4 learner.grpo_max_grad_norm=0.1 learner.grpo_beta=1.0 learner.grpo_adam_epsilon=1.0e-5 learner.grpo_adam_beta2=0.98 learner.grpo_eval_num_generalization_tasks=0 learner.gpt_enabled=true learner.gpt_sparse_threshold=0.1 learner.gpt_medium_threshold=0.3 learner.gpt_dense_threshold=0.5 learner.gpt_sparse_weight=0.8 learner.gpt_medium_weight=0.5 learner.gpt_transition_weight=0.3 learner.gpt_dense_weight=0.1 learner.gpt_max_retries=3 learner.gpt_retry_delay=1.0 learner.verbose=true suite="${SUITE}" "user_tasks=[${USER_TASK}]" "injection_tasks=[${INJECTION_TASK}]" seed=1 learner.seed=42 query_budget=260 "hydra.run.dir=${RUN_DIR}" hydra.job.chdir=false
          test -s "${RUN_DIR}/.hydra/config.yaml"
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - {name: ACCELERATE_TORCH_DEVICE, value: cuda:0}
        - name: OPENAI_API_KEY
          valueFrom: {secretKeyRef: {name: nrp-llm-token, key: NRP_LLM_TOKEN}}
        - {name: OPENAI_BASE_URL, value: https://ellm.nrp-nautilus.io/v1}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN}}
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN}}
        - {name: HOME, value: /work/home}
        - {name: TMPDIR, value: /work/tmp}
        - {name: HF_HUB_CACHE, value: /model-cache}
        - {name: HF_HUB_OFFLINE, value: "1"}
        - {name: TRANSFORMERS_OFFLINE, value: "1"}
        - {name: PIP_CACHE_DIR, value: /workspace/pip-cache}
        resources:
          requests: {cpu: "2", memory: 24Gi, nvidia.com/gpu: 1}
          limits: {cpu: "2", memory: 24Gi, nvidia.com/gpu: 1}
        volumeMounts:
        - {name: workspace, mountPath: /workspace, readOnly: true}
        - {name: workspace, mountPath: /workspace/results, subPath: results}
        - {name: workspace, mountPath: /workspace/pip-cache, subPath: pip-cache}
        - {name: workspace, mountPath: /model-cache, subPath: hf-cache, readOnly: true}
        - {name: private-work, mountPath: /work}
        - {name: runtime, mountPath: /runtime, readOnly: true}
      volumes:
      - name: workspace
        persistentVolumeClaim: {claimName: ucr-summer-workspace}
      - name: private-work
        emptyDir: {sizeLimit: 64Gi}
      - name: runtime
        configMap: {name: autoinject-qwen3-small-indexed-parallel-smoke-v1-runtime}
