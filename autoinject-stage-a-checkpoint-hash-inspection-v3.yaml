          )
          HYDRA_PLAIN_SCALAR = re.compile(r"[A-Za-z][A-Za-z0-9_-]*")
          HYDRA_INTEGER_SCALAR = re.compile(r"[+-]?[0-9]+")
          HYDRA_FLOAT_SCALAR = re.compile(
              r"[+-]?(?:[0-9]+\.[0-9]*|[0-9]*\.[0-9]+)(?:[eE][+-]?[0-9]+)?"
          )


          def classify_hydra_suite_scalar(raw_text):
              value = raw_text.strip()
              if value == "" or value in {"null", "Null", "NULL", "~"}:
                  return None, "NoneType"
              if len(value) >= 2 and value[0] == value[-1] == "'":
                  return value[1:-1].replace("''", "'"), "str"
              if len(value) >= 2 and value[0] == value[-1] == '"':
                  try:
                      decoded = json.loads(value)
                  except json.JSONDecodeError:
                      return value, "unsupported"
                  return decoded, type(decoded).__name__
              if value in {"true", "True", "TRUE", "false", "False", "FALSE"}:
                  return value.lower() == "true", "bool"
              if HYDRA_INTEGER_SCALAR.fullmatch(value):
                  return int(value), "int"
              if HYDRA_FLOAT_SCALAR.fullmatch(value):
                  return float(value), "float"
              if value.startswith("[") or value.endswith("]"):
                  return value, "list"
              if value.startswith("{") or value.endswith("}"):
                  return value, "dict"
              if HYDRA_PLAIN_SCALAR.fullmatch(value):
                  return value, "str"
              return value, "unsupported"


          def normalize_hydra_suite(raw_value, raw_value_type):
              if raw_value_type == "str" and raw_value in CANONICAL_SUITES:
                  return raw_value
              return None


          def fail_hydra_suite(reason, expected, raw_value, normalized, raw_type, path):
              fail(
                  f"Hydra suite validation failed ({reason}): "
                  f"expected_suite={expected!r}; raw_suite_value={raw_value!r}; "
                  f"normalized_suite={normalized!r}; raw_value_type={raw_type}; "
                  f"config_path={path}"
              )


          def parse_hydra_suite(text, expected, config_path):
              matches = list(HYDRA_SUITE_LINE.finditer(text))
              if len(matches) == 0:
                  fail_hydra_suite(
                      "missing top-level suite", expected, None, None, "NoneType", config_path
                  )
              if len(matches) != 1:
                  raw_values = [match.group("value").strip() for match in matches]
                  fail_hydra_suite(
                      "duplicate top-level suite keys",
                      expected,
                      raw_values,
                      None,
                      "list",
                      config_path,
                  )

              raw_value, raw_type = classify_hydra_suite_scalar(
                  matches[0].group("value")
              )
              normalized = normalize_hydra_suite(raw_value, raw_type)
              if normalized is None:
                  fail_hydra_suite(
                      "unknown or unsupported suite representation",
                      expected,
                      raw_value,
                      normalized,
                      raw_type,
                      config_path,
                  )
              if normalized != expected:
                  fail_hydra_suite(
                      "suite mismatch",
                      expected,
                      raw_value,
                      normalized,
                      raw_type,
                      config_path,
                  )
              return normalized


          def validate_hydra_identity(config_path, source):
              regular_nonempty(config_path, "Hydra config")
              text = config_path.read_text(encoding="utf-8")
              parse_hydra_suite(text, source["suite"], config_path)
              users = set(re.findall(r"\buser_task_\d+\b", text))
              injections = set(re.findall(r"\binjection_task_\d+\b", text))
              if users != {source["user_task"]}:
                  fail(f"Hydra user-task identity mismatch: {config_path}: {sorted(users)}")
              if injections != {source["injection_task"]}:
                  fail(
                      f"Hydra injection-task identity mismatch: "
                      f"{config_path}: {sorted(injections)}"
                  )


          if len(SOURCES) != 32:
              fail(f"Expected exactly 32 selected sources, found {len(SOURCES)}")

          pairs = [
              (source["suite"], source["user_task"], source["injection_task"])
              for source in SOURCES
          ]
          if len(set(pairs)) != len(pairs):
              fail("Selected source list contains duplicate task pairs")
          if set(pairs) != EXPECTED_PAIRS:
              fail(
                  f"Selected source pairs differ from the established 32: "
                  f"missing={sorted(EXPECTED_PAIRS - set(pairs))}, "
                  f"extra={sorted(set(pairs) - EXPECTED_PAIRS)}"
              )

          for field in ("checkpoint_path", "checkpoint_state_path", "chain_id"):
              values = [source[field] for source in SOURCES]
              if len(set(values)) != len(values):
                  fail(f"Selected source list contains duplicate {field} values")

          records = []
          for source in SOURCES:
              checkpoint = Path(source["checkpoint_path"])
              state_path = Path(source["checkpoint_state_path"])
              if not checkpoint.is_absolute() or not state_path.is_absolute():
                  fail(f"Selected source paths must be absolute: {checkpoint}, {state_path}")
              if checkpoint.name != "checkpoint.pt":
                  fail(f"Unexpected checkpoint filename: {checkpoint}")
              if state_path.name != "checkpoint_state.json":
                  fail(f"Unexpected checkpoint-state filename: {state_path}")
              if checkpoint.parent != state_path.parent:
                  fail(f"Checkpoint and state directories differ: {checkpoint}, {state_path}")

              checkpoint_metadata = regular_nonempty(checkpoint, "checkpoint")
              state_metadata = regular_nonempty(state_path, "checkpoint state")
              state = load_json(state_path, "checkpoint state")

              learner_state = state.get("learner_state")
              if not isinstance(learner_state, dict) or "queries_used" not in learner_state:
                  fail(f"learner_state.queries_used is absent: {state_path}")
              queries_used = learner_state["queries_used"]
              if isinstance(queries_used, bool) or not isinstance(queries_used, int):
                  fail(f"learner_state.queries_used must be an integer: {state_path}")
              if queries_used != source["expected_queries_used"]:
                  fail(
                      f"queries_used disagrees with finalized baseline report for "
                      f"{checkpoint}: {queries_used} != {source['expected_queries_used']}"
                  )

              model_info = state.get("model_info")
              if not isinstance(model_info, dict):
                  fail(f"model_info is absent from checkpoint state: {state_path}")
              recorded_checkpoint = model_info.get("checkpoint_path")
              if recorded_checkpoint != str(checkpoint):
                  fail(
                      f"checkpoint state path mismatch: "
                      f"{recorded_checkpoint!r} != {str(checkpoint)!r}"
                  )

              result_directory = checkpoint.parent.parent
              identity_validated = False
              provenance_path = result_directory / "provenance" / "provenance.json"
              if provenance_path.exists():
                  provenance = load_json(provenance_path, "provenance")
                  actual_identity = (
                      provenance.get("suite"),
                      provenance.get("user_task"),
                      provenance.get("injection_task"),
                  )
                  expected_identity = (
                      source["suite"],
                      source["user_task"],
                      source["injection_task"],
                  )
                  if actual_identity != expected_identity:
                      fail(
                          f"Provenance task identity mismatch: "
                          f"{provenance_path}: {actual_identity} != {expected_identity}"
                      )
                  if provenance.get("result_directory") != str(result_directory):
                      fail(
                          f"Provenance selected-result path mismatch: {provenance_path}"
                      )
                  identity_validated = True

              hydra_path = checkpoint.parent / ".hydra" / "config.yaml"
              if hydra_path.exists():
                  validate_hydra_identity(hydra_path, source)
                  identity_validated = True
              if not identity_validated:
                  fail(
                      f"No retained provenance or Hydra identity evidence for "
                      f"{source['suite']}/{source['user_task']}/{source['injection_task']}"
                  )

              checkpoint_sha256 = hash_file(checkpoint)
              known_hash = source.get("known_checkpoint_sha256")
              if known_hash is not None and checkpoint_sha256 != known_hash:
                  fail(
                      f"Checkpoint hash disagrees with retained inspection evidence: "
                      f"{checkpoint_sha256} != {known_hash}"
                  )

              records.append(
                  {
                      "chain_id": source["chain_id"],
                      "checkpoint_path": str(checkpoint),
                      "checkpoint_sha256": checkpoint_sha256,
                      "checkpoint_size_bytes": checkpoint_metadata.st_size,
                      "checkpoint_state_path": str(state_path),
                      "checkpoint_state_sha256": hash_file(state_path),
                      "checkpoint_state_size_bytes": state_metadata.st_size,
                      "injection_task": source["injection_task"],
                      "queries_used": queries_used,
                      "suite": source["suite"],
                      "user_task": source["user_task"],
                  }
              )

          if len(records) != 32:
              fail(f"Expected exactly 32 output records, found {len(records)}")
          for record in records:
              print(json.dumps(record, sort_keys=True, separators=(",", ":")))

          PY
