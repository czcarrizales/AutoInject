          def fail(message):
              raise RuntimeError(message)


          def regular_nonempty(path, label):
              try:
                  metadata = path.lstat()
              except FileNotFoundError:
                  fail(f"{label} is missing: {path}")
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size <= 0:
                  fail(f"{label} must be a regular nonempty file: {path}")
              return metadata


          def load_json(path, label):
              regular_nonempty(path, label)
              def reject_nonfinite(value):
                  fail(f"{label} contains non-finite JSON value {value}: {path}")
              try:
                  with path.open(encoding="utf-8") as handle:
                      value = json.load(handle, parse_constant=reject_nonfinite)
              except (OSError, json.JSONDecodeError) as error:
                  fail(f"{label} is not valid JSON: {path}: {error}")
              if not isinstance(value, dict):
                  fail(f"{label} must contain a JSON object: {path}")
              return value


          def hash_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


