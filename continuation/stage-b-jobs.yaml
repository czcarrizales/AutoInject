            "AI_SOURCE_CUMULATIVE": "260",
            "AI_SOURCE_SHA256": "16623c86cf403a04c41cbd479adcb0907928a73165698f0396ffc1f1a9dcfc78",
            "AI_SOURCE_SIZE": "3087560784",
            "AI_SOURCE_STAGE": "A",
            "AI_SOURCE_STAGE_QUERIES": "260",
            "AI_SOURCE_STATE": "/workspace/results/autoinject-qwen3-small/l40-cold-baseline-v1/indexed-remaining-31-attempt-02/slack-u20-i5-attempt-02/run/checkpoint_state.json",
            "AI_SOURCE_STATE_SHA256": "a755c0d8d21b53b08b5debc6e19f733bfc49abaaed6e34178efda310e89e425d",
            "AI_SOURCE_STATE_SIZE": "2712",
            "AI_STAGE": "B",
            "AI_STAGE_RECORD": "/workspace/results/autoinject-qwen3-small/continuations/v1/records/stages/slack-u20-i5-chain-001--stage-B--slack-u20-i5-chain-001-stage-b-v1.json",
