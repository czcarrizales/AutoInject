apiVersion: batch/v1
kind: Job
metadata:
  name: autoinject-stage-c-v1
  namespace: ucr-rai-chazz
  labels:
    app.kubernetes.io/name: autoinject-qwen3-small
    autoinject-run-kind: continuation-stage-c-v1
    autoinject-stage: c
    autoinject-suite: multi
  annotations:
    autoinject.ucr.edu/code-commit: 66f4e040e891926bd493b5466d501d11b3f7fa96
    autoinject.ucr.edu/task-map-sha256: 6eda77d07b74609522a6b45d23ddf6f7e3ba5cae1c3c7769d2b8fbd2081253d1
    autoinject.ucr.edu/job-inventory-payload-sha256: 5c005f7ca45b043bf4963210510e4cda5926a7ef47cad32fb3cbdcd2b9facee8
spec:
  completions: 32
  parallelism: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoinject-qwen3-small
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-L40
                - NVIDIA-L40S
      initContainers:
      - name: checkout-code
        image: alpine/git:v2.47.2
        command:
        - /bin/sh
        - -ec
        args:
        - |
          set -euxo pipefail
          export GIT_TERMINAL_PROMPT=0
          BRANCH=experiment/stage-b-policy-warm-start
          COMMIT=66f4e040e891926bd493b5466d501d11b3f7fa96
          REPO=/work/AutoInject
          test ! -e "${REPO}"
          mkdir -p "${REPO}"
          git -C "${REPO}" init
          git -C "${REPO}" remote add origin https://github.com/czcarrizales/AutoInject.git
          timeout 300 git -C "${REPO}" fetch --no-tags origin "refs/heads/${BRANCH}"
          git -C "${REPO}" merge-base --is-ancestor "${COMMIT}" FETCH_HEAD
          git -C "${REPO}" checkout --detach "${COMMIT}"
          test "$(git -C "${REPO}" rev-parse HEAD)" = "${COMMIT}"
          test -z "$(git -C "${REPO}" status --porcelain)"
          printf '%s\n' "${COMMIT}" > /work/validated-code-commit
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: work
          mountPath: /work
      containers:
      - name: stage-c
        image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        args:
        - |
          set -Eeuo pipefail
          PYTHON=/opt/conda/bin/python
          TASK_MAP="/indexed/tasks.json"
          TASK_MAP_SHA256="6eda77d07b74609522a6b45d23ddf6f7e3ba5cae1c3c7769d2b8fbd2081253d1"
          test "$(sha256sum "${TASK_MAP}" | awk '{print $1}')" = "${TASK_MAP_SHA256}"
          : "${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
          TASK_EXPORTS="$("${PYTHON}" - "${TASK_MAP}" "${JOB_COMPLETION_INDEX}" <<'PY'
          import json
          import re
          import shlex
          import sys

          expected = set(('AI_SOURCE_CHECKPOINT', 'AI_SOURCE_STATE', 'AI_SOURCE_SHA256', 'AI_SOURCE_SIZE', 'AI_SOURCE_STATE_SHA256', 'AI_SOURCE_STATE_SIZE', 'AI_SOURCE_STAGE_QUERIES', 'AI_SOURCE_CUMULATIVE', 'AI_CHAIN_ID', 'AI_RUN_ID', 'AI_RESULT_ROOT', 'AI_STAGE_RECORD', 'AI_STAGE', 'AI_SOURCE_STAGE', 'AI_EXPERIMENT_ID', 'AI_SUITE', 'AI_USER_TASK', 'AI_INJECTION_TASK', 'AI_CONFIGURATION_FINGERPRINT'))
          raw_index = sys.argv[2]
          if re.fullmatch(r"(0|[1-9][0-9]*)", raw_index) is None:
              raise SystemExit("invalid JOB_COMPLETION_INDEX")
          index = int(raw_index)
          with open(sys.argv[1], encoding="utf-8") as handle:
              document = json.load(handle)
          if document.get("schema_version") != 1:
              raise SystemExit("invalid indexed task schema")
          tasks = document.get("tasks")
          if (
              document.get("task_count") != 32
              or not isinstance(tasks, list)
              or len(tasks) != 32
          ):
              raise SystemExit("invalid indexed task count")
          if not 0 <= index < len(tasks):
              raise SystemExit("JOB_COMPLETION_INDEX out of range")
          task = tasks[index]
          if (
              not isinstance(task, dict)
              or set(task) != {"completion_index", "pair", "env"}
              or task.get("completion_index") != index
          ):
              raise SystemExit("indexed task record mismatch")
          env = task.get("env")
          if not isinstance(env, dict) or set(env) != expected:
              raise SystemExit("indexed task environment mismatch")
          for name in sorted(expected):
              value = env[name]
              if not isinstance(value, str) or "\x00" in value:
                  raise SystemExit(f"invalid indexed task value: {name}")
              print(f"export {name}={shlex.quote(value)}")
          PY
          )"
          eval "${TASK_EXPORTS}"
          REPO=/work/AutoInject
          CODE_COMMIT=66f4e040e891926bd493b5466d501d11b3f7fa96
          SOURCE_CHECKPOINT="${AI_SOURCE_CHECKPOINT}"
          SOURCE_STATE="${AI_SOURCE_STATE}"
          SOURCE_SHA256="${AI_SOURCE_SHA256}"
                    SOURCE_SIZE="${AI_SOURCE_SIZE}"
                    SOURCE_STATE_SHA256="${AI_SOURCE_STATE_SHA256}"
                    SOURCE_STATE_SIZE="${AI_SOURCE_STATE_SIZE}"
          RECORDS_ROOT=/workspace/results/autoinject-qwen3-small/continuations/v1
          CONSTRAINTS=/runtime/continuation-runtime.txt
          CHAIN_ID="${AI_CHAIN_ID}"
          RUN_ID="${AI_RUN_ID}"
          RESULT_ROOT="${AI_RESULT_ROOT}"
          RUN_DIR=${RESULT_ROOT}/run
          STAGE_RECORD="${AI_STAGE_RECORD}"
          test "$(cat /work/validated-code-commit)" = "${CODE_COMMIT}"
          test -f "${SOURCE_CHECKPOINT}"
          test -f "${SOURCE_STATE}"
          test "$(stat -c %s "${SOURCE_CHECKPOINT}")" = "${SOURCE_SIZE}"
                    test "$(sha256sum "${SOURCE_CHECKPOINT}" | awk '{print $1}')" = "${SOURCE_SHA256}"
                    test "$(stat -c %s "${SOURCE_STATE}")" = "${SOURCE_STATE_SIZE}"
                    test "$(sha256sum "${SOURCE_STATE}" | awk '{print $1}')" = "${SOURCE_STATE_SHA256}"
          "${PYTHON}" -c 'import json,sys; state=json.load(open(sys.argv[1])); assert state["learner_state"]["queries_used"] == int(sys.argv[2])' "${SOURCE_STATE}" "${AI_SOURCE_STAGE_QUERIES}"
          test ! -e "${RESULT_ROOT}"
          test ! -e "${STAGE_RECORD}"
          mkdir -p /work/home /work/tmp /work/pip-cache
          test "$(sha256sum "${CONSTRAINTS}" | awk '{print $1}')" = 94c521b60ee9623960c472c2c740ae8eab2cdf49254723b58b308a7c60487345
          "${PYTHON}" -m pip install --constraint "${CONSTRAINTS}" --editable "${REPO}/agentdojo"
          "${PYTHON}" -m pip install --constraint "${CONSTRAINTS}" --editable "${REPO}"
          export PYTHONPATH=${REPO}/src:${REPO}/agentdojo/src
          "${PYTHON}" - <<'PY'
          import accelerate, numpy, openai, peft, torch, transformers, trl
          assert torch.__version__ == "2.5.1+cu124"
          assert transformers.__version__ == "4.57.0"
          assert trl.__version__ == "0.24.0"
          assert accelerate.__version__ == "1.14.0"
          assert peft.__version__ == "0.20.0"
          assert numpy.__version__ == "2.1.2"
          assert openai.__version__ == "2.53.0"
          PY
          TRL_FILE="$("${PYTHON}" -c 'import trl.trainer.grpo_trainer as m; print(m.__file__)')"
          test "$(sha256sum "${TRL_FILE}" | awk '{print $1}')" = bb6905182acf2ec426f1dc9ffc37e5210d58ee47d2764f7cf12dbb90a4a28954
          "${PYTHON}" - "${TRL_FILE}" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old_signature = '''        peft_config: Optional["PeftConfig"] = None,\n    ):\n'''
          new_signature = '''        peft_config: Optional["PeftConfig"] = None,\n        ref_model: Optional[PreTrainedModel] = None,\n    ):\n'''
          old_reference = '''        else:\n            # For deepspeed, fsdp or non-distributed models, create a reference model from scratch\n            config = AutoConfig.from_pretrained(model_id)\n            architecture = getattr(transformers, config.architectures[0])\n            self.ref_model = architecture.from_pretrained(model_id, **model_init_kwargs)\n'''
          new_reference = '''        else:\n            if ref_model is not None:\n                self.ref_model = ref_model\n            else:\n                # For deepspeed, fsdp or non-distributed models, create a reference model from scratch\n                config = AutoConfig.from_pretrained(model_id)\n                architecture = getattr(transformers, config.architectures[0])\n                self.ref_model = architecture.from_pretrained(model_id, **model_init_kwargs)\n'''
          assert text.count(old_signature) == 1
          assert text.count(old_reference) == 1
          text = text.replace(old_signature, new_signature).replace(old_reference, new_reference)
          path.write_text(text, encoding="utf-8")
          PY
          test "$(sha256sum "${TRL_FILE}" | awk '{print $1}')" = 41aa37447a07da8962b80f599d3f7d75528818b9b25072ce0f39d043f596d725
          mkdir -p "$(dirname "${RESULT_ROOT}")" "$(dirname "${STAGE_RECORD}")"
          mkdir "${RESULT_ROOT}" "${RUN_DIR}"
          cd "${RUN_DIR}"
          set +e
          "${PYTHON}" -u -m rlpi.agentdojo.adaptive_agentdojo \
            exp_ident="${AI_EXPERIMENT_ID}" \
            model=facebook/Meta-SecAlign-8B victim_device=cuda:0 \
            learner=trl_suffix_meta_secalign_repro \
            learner.attack_model_name=Qwen/Qwen2-1.5B learner.device=cuda:0 \
            +learner.feedback_model=qwen3-small \
            learner.feedback_fallback_model=gpt-4o-mini-2024-07-18 \
            learner.max_suffix_length=30 learner.temperature=0.9 learner.top_p=0.95 \
            learner.min_experiences_for_training=1 \
            learner.grpo_num_generations=8 learner.grpo_num_iterations=5 \
            learner.grpo_learning_rate=1.0e-5 \
            learner.grpo_per_device_train_batch_size=2 \
            learner.grpo_gradient_accumulation_steps=2 learner.grpo_warmup_steps=4 \
            learner.grpo_max_grad_norm=0.1 learner.grpo_beta=1.0 \
            learner.grpo_adam_epsilon=1.0e-5 learner.grpo_adam_beta2=0.98 \
            learner.grpo_eval_num_generalization_tasks=0 \
            learner.gpt_enabled=true learner.gpt_sparse_threshold=0.1 \
            learner.gpt_medium_threshold=0.3 learner.gpt_dense_threshold=0.5 \
            learner.gpt_sparse_weight=0.8 learner.gpt_medium_weight=0.5 \
            learner.gpt_transition_weight=0.3 learner.gpt_dense_weight=0.1 \
            learner.gpt_max_retries=3 learner.gpt_retry_delay=1.0 learner.verbose=true \
            model_id=null attack=direct defense=null system_message=null \
            force_rerun=false max_tokens=null 'modules_to_load=[]' \
            suite="${AI_SUITE}" "user_tasks=[${AI_USER_TASK}]" "injection_tasks=[${AI_INJECTION_TASK}]" \
            seed=1 learner.seed=42 query_budget=260 \
            initialization_mode=policy_warm reference_mode=source \
            source_checkpoint_path="${SOURCE_CHECKPOINT}" source_checkpoint_sha256="${SOURCE_SHA256}" \
            source_checkpoint_size_bytes="${SOURCE_SIZE}" source_stage_queries_used="${AI_SOURCE_STAGE_QUERIES}" \
            source_checkpoint_state_path="${SOURCE_STATE}" source_checkpoint_state_sha256="${SOURCE_STATE_SHA256}" \
            source_checkpoint_state_size_bytes="${SOURCE_STATE_SIZE}" \
            continuation_records_root="${RECORDS_ROOT}" result_root="${RESULT_ROOT}" \
            stage_record_path="${STAGE_RECORD}" configuration_fingerprint="${AI_CONFIGURATION_FINGERPRINT}" \
            chain_id="${CHAIN_ID}" stage="${AI_STAGE}" run_id="${RUN_ID}" source_stage="${AI_SOURCE_STAGE}" \
            source_cumulative_queries_used="${AI_SOURCE_CUMULATIVE}" git_commit="${CODE_COMMIT}" \
            "hydra.run.dir=${RUN_DIR}" hydra.job.chdir=false \
            2>&1 | tee "${RUN_DIR}/stdout.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${#pipeline_status[@]}" -eq 2
          test "${pipeline_status[0]}" -eq 0
          test "${pipeline_status[1]}" -eq 0
          test -s "${RUN_DIR}/checkpoint.pt"
          test -s "${RUN_DIR}/checkpoint_state.json"
          test -s "${RUN_DIR}/grpo_training_outputs/experience_history.jsonl"
          test -s "${RUN_DIR}/grpo_training_outputs/grpo_evaluations.jsonl"
          "${PYTHON}" - "${RUN_DIR}/checkpoint.pt" "${RUN_DIR}/checkpoint_state.json" <<'PY'
          import json
          import sys
          import torch
          checkpoint = torch.load(sys.argv[1], map_location="cpu", weights_only=True, mmap=True)
          assert isinstance(checkpoint, dict)
          assert isinstance(checkpoint.get("policy_state_dict"), dict) and checkpoint["policy_state_dict"]
          assert all(torch.is_tensor(value) for value in checkpoint["policy_state_dict"].values())
          assert isinstance(checkpoint.get("model_config"), dict)
          with open(sys.argv[2], encoding="utf-8") as handle:
              state = json.load(handle)
          assert isinstance(state, dict)
          assert isinstance(state.get("learner_state"), dict)
          queries = state["learner_state"].get("queries_used")
          assert isinstance(queries, int) and not isinstance(queries, bool) and 0 <= queries <= 260
          assert isinstance(state.get("experiment_reporting"), dict)
          assert isinstance(state.get("continuation"), dict)
          PY
          test -s "${RUN_DIR}/stage-publication-request.json"
          test -s "${RUN_DIR}/stdout.log"
          test ! -e "${STAGE_RECORD}"
          exec "${PYTHON}" -m rlpi.agentdojo.continuation_reporting \
            --publish-request "${RUN_DIR}/stage-publication-request.json" \
            --stdout-log "${RUN_DIR}/stdout.log"
        env:
        - name: ACCELERATE_TORCH_DEVICE
          value: cuda:0
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: nrp-llm-token
              key: NRP_LLM_TOKEN
        - name: OPENAI_BASE_URL
          value: https://ellm.nrp-nautilus.io/v1
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HOME
          value: /work/home
        - name: TMPDIR
          value: /work/tmp
        - name: HF_HUB_CACHE
          value: /model-cache
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: PIP_CACHE_DIR
          value: /workspace/pip-cache
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        resources:
          requests:
            cpu: '2'
            memory: 24Gi
            nvidia.com/gpu: 1
          limits:
            cpu: '2'
            memory: 24Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: workspace
          mountPath: /workspace/results
          subPath: results
        - name: workspace
          mountPath: /workspace/pip-cache
          subPath: pip-cache
        - name: workspace
          mountPath: /model-cache
          subPath: hf-cache
          readOnly: true
        - name: work
          mountPath: /work
        - name: runtime
          mountPath: /runtime
          readOnly: true
        - name: indexed-task-map
          mountPath: /indexed
          readOnly: true
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: ucr-summer-workspace
      - name: work
        emptyDir:
          sizeLimit: 64Gi
      - name: runtime
        configMap:
          name: autoinject-continuation-runtime-v1
      - name: indexed-task-map
        configMap:
          name: autoinject-stage-c-v1-tasks-6eda77d07b74
      activeDeadlineSeconds: 252000
  completionMode: Indexed
  backoffLimitPerIndex: 0
  maxFailedIndexes: 32
