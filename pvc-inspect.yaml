apiVersion: v1
kind: Pod
metadata:
  name: pvc-inspect
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: alpine:3.20
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: ucr-summer-workspace
