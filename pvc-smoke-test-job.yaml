apiVersion: batch/v1
kind: Job
metadata:
  name: pvc-smoke-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pvc-test
        image: ubuntu:22.04
        command: ["bash", "-lc"]
        args:
          - |
            set -e
            echo "=== PVC MOUNT TEST ==="
            date
            echo "hello from pvc-smoke-test" > /workspace/pvc-smoke-test.txt
            cat /workspace/pvc-smoke-test.txt

            echo
            echo "=== PVC SPACE ==="
            df -h /workspace

            echo
            echo "=== TOP LEVEL FILES ==="
            ls -lah /workspace

            echo
            echo "=== TOP LEVEL SIZE ==="
            du -sh /workspace/* 2>/dev/null || true

            echo
            echo "PVC smoke test completed."
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: ucr-summer-workspace
